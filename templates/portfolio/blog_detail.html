{% extends "base.html" %}


{% block title %}

{{ post.title }} | Blog

{% endblock %}


{% block content %}

<section class="pt-36 pb-24">

    <article
        class="max-w-4xl mx-auto px-5 lg:px-8"
    >

        <p class="text-sm text-slate-500">

            {{ post.created_at|date:"F d, Y" }}

        </p>


        <h1
            class="text-4xl md:text-6xl font-extrabold mt-4 leading-tight"
        >

            {{ post.title }}

        </h1>


        <p
            class="text-xl text-slate-500 dark:text-slate-400 mt-6 leading-8"
        >

            {{ post.excerpt }}

        </p>


        {% if post.image %}

        <img
            src="{{ post.image.url }}"
            alt="{{ post.title }}"
            class="w-full rounded-3xl mt-10"
        >

        {% endif %}


        <div
            class="mt-10 text-lg leading-8 text-slate-600 dark:text-slate-300"
        >

            {{ post.content|linebreaks }}

        </div>


        <a
            href="{% url 'portfolio:home' %}#blog"
            class="inline-block mt-10 text-indigo-500 font-semibold"
        >

            ← Back to home

        </a>

    </article>

</section>

{% endblock %}
